<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 24" width="840" height="24" role="img" aria-label="Séparateur calibré">
  <defs>
    <style>
      .static-fallback { display: none; }
      @media (prefers-reduced-motion: reduce) {
        .motion-only { display: none; }
        .static-fallback { display: inline; }
      }
    </style>
    <linearGradient id="div-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E04724" stop-opacity="0.25"/>
    </linearGradient>
    <path id="div-track" d="M 16 12 L 824 12"/>
  </defs>

  <!-- Graduations compatibles thème clair et sombre -->
  <line x1="16" y1="12" x2="824" y2="12" stroke="#64748B" stroke-width="1" opacity="0.45"/>
  <g stroke="#64748B" stroke-width="1" opacity="0.55">
    <line x1="16" y1="7" x2="16" y2="17"/>
    <line x1="218" y1="9" x2="218" y2="15"/>
    <line x1="420" y1="6" x2="420" y2="18"/>
    <line x1="622" y1="9" x2="622" y2="15"/>
    <line x1="824" y1="7" x2="824" y2="17"/>
  </g>

  <!-- Ligne animée qui se dessine + curseur mobile SMIL -->
  <g class="motion-only">
    <line x1="16" y1="12" x2="824" y2="12" stroke="url(#div-grad)" stroke-width="2" stroke-dasharray="808" stroke-dashoffset="808">
      <animate attributeName="stroke-dashoffset" values="808;0;0;808" keyTimes="0;0.4;0.85;1" dur="5.5s" repeatCount="indefinite"/>
    </line>
    <circle r="3.5" fill="#E04724">
      <animateMotion dur="5.5s" repeatCount="indefinite" keyPoints="0;1;0" keyTimes="0;0.5;1" calcMode="linear">
        <mpath href="#div-track"/>
      </animateMotion>
    </circle>
  </g>

  <!-- Repli statique -->
  <g class="static-fallback">
    <line x1="16" y1="12" x2="824" y2="12" stroke="url(#div-grad)" stroke-width="2"/>
    <circle cx="420" cy="12" r="3.5" fill="#E04724"/>
  </g>
</svg>
